name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3

      - name: Abhängigkeiten installieren
        working-directory: Heizungskonfigurator/Frontend
        run: npm ci

      - name: Frontend bauen
        working-directory: Heizungskonfigurator/Frontend
        run: npm run build
